name: Ads Daily - ARKHE ZERO Publicitario

on:
  schedule:
    - cron: '0 15 * * *'  # 9am MX = 15:00 UTC
  workflow_dispatch:

jobs:
  ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Ads Agent
        run: |
          python tools/sentinel/ads-agent.py
          python tools/sentinel/track.py
      - name: Create daily report
        run: |
          echo "## Ads Report $(date)" >> $GITHUB_STEP_SUMMARY
          echo "SCDR-002: SCDR-TOLUCA-GLOBAL-ed13d0a6" >> $GITHUB_STEP_SUMMARY
          echo "【entity-Polygon¦canonical_name=Polygon】: 0x4152a9fa... + IPFS: bafybeig4152a9fa..." >> $GITHUB_STEP_SUMMARY
          echo "Links: 99-1499 LIVE" >> $GITHUB_STEP_SUMMARY
