<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCDR-002 APP - Toluca</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#00ffff"><meta name="mobile-web-app-capable" content="yes"><style>body{margin:0;background:#0a0a0f;color:#e0e0e0;font-family:monospace;padding:20px;text-align:center} .card{border:1px solid #00ffff;box-shadow:0 0 20px #00ffff33;padding:20px;border-radius:12px;background:rgba(0,255,255,0.05);margin:20px auto;max-width:500px} button{padding:14px 20px;background:#00ffff;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px} button:hover{box-shadow:0 0 20px #00ffff} .ok{color:#00ff88} .btc{color:#ffaa00}</style></head><body>
<h1>SCDR-002 APP</h1>

<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});

document.getElementById('file').addEventListener('change', async e=>{
 const f=e.target.files[0]; if(!f) return;
 const buf=await f.arrayBuffer();
 const h=await crypto.subtle.digest('SHA-256',buf);
 const hex=Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
 document.getElementById('hash').innerHTML='<p class=ok>SHA256: '+hex+'</p><p>Archivo: '+f.name+' - '+f.size+' bytes</p><p>Origen: Toluca Termux</p>';
});
